<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScentTalks | Fragrance Discussion Challenge</title>
    
    <!-- Favicon: Logo Botol Parfum Minimalis -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23d97706%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22M6 10a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V10z%22></path><path d=%22M9 5a3 3 0 0 1 6 0v3H9V5z%22></path></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #fdfdfb;
            color: #1a1a1a;
        }
        .serif-font {
            font-family: 'Playfair Display', serif;
        }
        .accent-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.04);
        }
        .progress-bar {
            transition: width 1s linear;
        }
        #topic-box {
            transition: all 0.2s ease-out;
        }
        .spinning {
            filter: blur(2px);
            opacity: 0.7;
            transform: scale(0.98);
        }
        .btn-primary {
            background-color: #1a1a1a;
            color: #ffffff;
            transition: all 0.2s ease;
        }
        .btn-primary:hover:not(:disabled) {
            background-color: #333333;
            transform: translateY(-1px);
        }
        .btn-primary:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }
        .btn-outline {
            border: 1px solid #e5e7eb;
            background: #ffffff;
            color: #4b5563;
            transition: all 0.2s ease;
        }
        .btn-outline:hover {
            background: #f9fafb;
            border-color: #d1d5db;
        }
        .toast {
            transform: translateX(-50%) translateY(100px);
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">

    <div class="max-w-md w-full text-center">
        <!-- Header -->
        <header class="mb-10">
            <h1 class="serif-font text-4xl font-bold tracking-tight mb-2 text-black italic">ScentTalks.</h1>
            <p class="text-[11px] uppercase tracking-[0.3em] text-gray-400 font-bold">Fragrance Community Hub</p>
        </header>

        <!-- Main Container -->
        <div class="accent-card p-8 rounded-3xl relative overflow-hidden mb-6">
            
            <!-- Top Status Row (Anti-Overlap) -->
            <div class="flex justify-between items-start mb-6 min-h-[32px]">
                <!-- Category Badge -->
                <div id="type-badge" class="invisible bg-gray-50 px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider text-gray-400 border border-gray-100 transition-all self-start">
                    Hot Take
                </div>

                <!-- Timer Info (Right Side) -->
                <div id="phase-container" class="hidden text-right">
                    <span id="timer-number" class="font-mono text-xl font-bold text-gray-800 block leading-none">60s</span>
                    <span id="phase-label" class="text-[9px] font-bold uppercase tracking-widest text-amber-600 block mt-1">Fase Persiapan</span>
                </div>
            </div>

            <!-- Progress Bar -->
            <div id="progress-wrapper" class="hidden w-full bg-gray-100 h-1 rounded-full overflow-hidden mb-8">
                <div id="progress" class="progress-bar h-full bg-amber-500 w-full"></div>
            </div>

            <!-- Content Area -->
            <div id="topic-box" class="min-h-[160px] flex flex-col items-center justify-center">
                <p id="topic-text" class="text-lg md:text-xl font-semibold leading-relaxed text-gray-800 px-2">
                    Siapkan argumen Anda. <br> 
                    <span class="text-gray-400 text-base font-normal mt-2 block italic">Silakan tekan tombol di bawah untuk mendapatkan topik diskusi hari ini.</span>
                </p>
            </div>
        </div>

        <!-- Action Section -->
        <div class="space-y-3">
            <button id="gen-btn" class="btn-primary w-full py-5 rounded-2xl font-bold text-sm uppercase tracking-widest shadow-sm">
                Dapatkan Topik Baru
            </button>
            
            <button id="timer-btn" class="hidden w-full py-4 rounded-2xl bg-amber-50 border border-amber-100 text-amber-700 font-bold text-xs uppercase tracking-widest hover:bg-amber-100 transition-all">
                Mulai Tantangan (2 Menit)
            </button>

            <div class="flex gap-2">
                <button id="copy-btn" class="btn-outline flex-1 py-3 rounded-xl text-[10px] font-bold uppercase tracking-wider">
                    Salin Topik
                </button>
                <button id="reset-btn" class="btn-outline flex-1 py-3 rounded-xl text-[10px] font-bold uppercase tracking-wider text-red-500 border-red-500/20 hover:bg-red-50">
                    Reset App
                </button>
            </div>
        </div>

        <footer class="mt-16 opacity-50">
            <p class="text-[9px] font-bold uppercase tracking-[0.2em] text-gray-400">ScentTalks v2.7 • Stable Layout</p>
        </footer>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast fixed bottom-10 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full text-xs font-bold shadow-xl opacity-0 pointer-events-none z-50">
        Berhasil disalin ke clipboard!
    </div>

    <script>
        const database = [
            // Original Database
            { type: "HOT TAKE", content: "Parfum lokal harganya makin nggak ngotak, mending beli desainer sekalian." },
            { type: "TOPIK DISKUSI", content: "Kenapa orang Indonesia obsesi banget sama parfum 'Beast Mode'?" },
            { type: "HOT TAKE", content: "Notes Vanilla itu ngebosenin dan nggak ada seninya sama sekali." },
            { type: "TOPIK DISKUSI", content: "Seberapa penting botol parfum buat kalian? Rela bayar mahal demi botol?" },
            { type: "HOT TAKE", content: "Gatekeeping parfum itu sah-sah aja biar wangi lu nggak pasaran." },
            { type: "TOPIK DISKUSI", content: "Mending beli 1 parfum 5 juta atau 10 parfum 500 rebu?" },
            { type: "HOT TAKE", content: "Parfum cloning/dupe itu sebenernya ngerusak industri kreatif." },
            { type: "HOT TAKE", content: "Influencer yang bilang 'semua parfum blind buy worthy' itu trik marketing." },
            { type: "TOPIK DISKUSI", content: "Kalo parfum favorit lu discontinue, lu bakal cari stock lama atau move on?" },
            { type: "HOT TAKE", content: "Wanginya Sauvage itu udah jadi bau 'Mas-Mas Kantor' standar." },
            { type: "TOPIK DISKUSI", content: "Apa parfum paling 'overrated' yang pernah lu beli karena hype?" },
            { type: "HOT TAKE", content: "Pake parfum mahal tapi nggak mandi itu percuma, tetep bau apek." },
            { type: "HOT TAKE", content: "Longevity (tahan lama) itu faktor paling nggak penting dalam kualitas parfum." },
            { type: "TOPIK DISKUSI", content: "Ada nggak notes parfum yang bikin lu auto mual kalo nyium?" },
            
            // Additional Database
            { type: "HOT TAKE", content: "Parfum 'Blue' atau 'Fresh' harganya nggak masuk akal kalo di atas 3 juta." },
            { type: "TOPIK DISKUSI", content: "Ceritain Blind Buy paling sukses yang pernah kalian alamin." },
            { type: "HOT TAKE", content: "Sillage yang menuhin ruangan itu sebenernya considered polusi udara." },
            { type: "TOPIK DISKUSI", content: "Notes apa yang paling sulit kalian nikmatin? (Misal: Rose, Oud, Leather)" },
            { type: "HOT TAKE", content: "Brand desainer sekarang cuma ngejar mass-appeal dan mulai kehilangan jati diri." },
            { type: "TOPIK DISKUSI", content: "Apa parfum paling 'Safe' buat dipake ke acara kondangan outdoor?" },
            { type: "TOPIK DISKUSI", content: "Dapet pujian (compliment) parfum apa yang menurut kalian paling berkesan?" },
            { type: "TOPIK DISKUSI", content: "Kalo disuruh milih 1 notes parfum selamanya, kalian bakal milih apa?" },
            { type: "HOT TAKE", content: "Parfum 'Unisex' itu trik marketing; hidung kita tetep bakal ngelabelin itu maskulin atau feminin." },
            { type: "TOPIK DISKUSI", content: "Parfum apa yang menurut kalian aromanya paling berasa 'Mahal'?" },
            { type: "HOT TAKE", content: "Niche perfumery sekarang makin nggak ada bedanya sama desainer, cuma beda harga." },
            { type: "TOPIK DISKUSI", content: "Botol parfum mana yang menurut kalian desainnya paling jelek atau norak?" },
            { type: "TOPIK DISKUSI", content: "Siapa Perfumer (idaman) kalian yang karyanya selalu kalian pantau?" },
            { type: "HOT TAKE", content: "Parfum 'Indie' seringkali cuma eksperimen amatir yang dijual dengan harga Niche." },
            { type: "TOPIK DISKUSI", content: "Notes 'Sweet/Gourmand' itu kategori yang paling gampang bikin bosen." },
            { type: "TOPIK DISKUSI", content: "Pengalaman dapet 'Bad Compliment' gara-gara parfum yang paling lucu apa?" }
        ];

        let timerInterval;
        let timeLeft = 60;
        let phase = 'idle'; 

        const topicBox = document.getElementById('topic-box');
        const topicText = document.getElementById('topic-text');
        const badge = document.getElementById('type-badge');
        const genBtn = document.getElementById('gen-btn');
        const timerBtn = document.getElementById('timer-btn');
        const resetBtn = document.getElementById('reset-btn');
        const phaseContainer = document.getElementById('phase-container');
        const phaseLabel = document.getElementById('phase-label');
        const timerNumber = document.getElementById('timer-number');
        const progressBar = document.getElementById('progress');
        const progressWrapper = document.getElementById('progress-wrapper');

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function resetTimer() {
            clearInterval(timerInterval);
            phase = 'idle';
            timeLeft = 60;
            phaseContainer.classList.add('hidden');
            progressWrapper.classList.add('hidden');
            timerBtn.classList.remove('hidden');
            timerBtn.innerText = "MULAI TANTANGAN (2 MENIT)";
            progressBar.style.width = '100%';
        }

        function updateBadge(type) {
            badge.innerText = type;
            badge.classList.remove('invisible');
            if(type === "HOT TAKE") {
                badge.style.color = "#dc2626";
                badge.style.borderColor = "#fee2e2";
                badge.style.backgroundColor = "#fef2f2";
            } else {
                badge.style.color = "#0284c7";
                badge.style.borderColor = "#e0f2fe";
                badge.style.backgroundColor = "#f0f9ff";
            }
        }

        function startPhase(currentPhase) {
            phase = currentPhase;
            timeLeft = 60;
            phaseContainer.classList.remove('hidden');
            progressWrapper.classList.remove('hidden');
            
            if (phase === 'thinking') {
                phaseLabel.innerText = "Fase 1: Persiapan";
                phaseLabel.style.color = "#d97706";
                progressBar.style.backgroundColor = "#fbbf24";
            } else {
                phaseLabel.innerText = "Fase 2: Diskusi";
                phaseLabel.style.color = "#0284c7";
                progressBar.style.backgroundColor = "#0ea5e9";
            }

            timerInterval = setInterval(() => {
                timeLeft--;
                timerNumber.innerText = timeLeft + 's';
                progressBar.style.width = (timeLeft / 60 * 100) + '%';

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if (phase === 'thinking') {
                        startPhase('talking');
                    } else {
                        phaseLabel.innerText = "SELESAI!";
                        timerBtn.innerText = "COBA LAGI?";
                        showToast("Waktu habis! Sesi diskusi berakhir.");
                    }
                }
            }, 1000);
        }

        genBtn.addEventListener('click', () => {
            if (genBtn.disabled) return;
            
            resetTimer();
            genBtn.disabled = true;
            topicBox.classList.add('spinning');
            badge.classList.add('invisible');
            
            let rounds = 0;
            const maxRounds = 12; 
            
            const roulette = setInterval(() => {
                const tempIndex = Math.floor(Math.random() * database.length);
                topicText.innerHTML = `<span class="text-gray-400 font-normal">"${database[tempIndex].content}"</span>`;
                rounds++;
                
                if (rounds >= maxRounds) {
                    clearInterval(roulette);
                    const finalItem = database[Math.floor(Math.random() * database.length)];
                    topicText.innerHTML = `<span class="text-gray-900 italic">"${finalItem.content}"</span>`;
                    updateBadge(finalItem.type);
                    topicBox.classList.remove('spinning');
                    genBtn.disabled = false;
                    timerBtn.classList.remove('hidden');
                }
            }, 80);
        });

        timerBtn.addEventListener('click', () => {
            if (phase === 'idle') {
                startPhase('thinking');
                timerBtn.innerText = "TANTANGAN BERJALAN...";
            }
        });

        resetBtn.addEventListener('click', () => {
            resetTimer();
            topicText.innerHTML = `Siapkan argumen Anda. <br> <span class="text-gray-400 text-base font-normal mt-2 block italic">Silakan tekan tombol di bawah untuk mendapatkan topik diskusi hari ini.</span>`;
            badge.classList.add('invisible');
            timerBtn.classList.add('hidden');
        });

        document.getElementById('copy-btn').addEventListener('click', () => {
            const text = topicText.innerText;
            if (text.includes("Siapkan argumen")) return;
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            showToast("Berhasil disalin!");
        });
    </script>
</body>
</html>
